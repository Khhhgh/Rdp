name: Telegram Bot 24-7

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # يعيد تشغيل نفسه كل 5 ساعات لتجنب حد الـ 6 ساعات
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install yt-dlp

    - name: Start Bot
      run: |
        # تشغيل البوت في الخلفية
        python3 bot.py &
        
        # يبقي الجلسة شحالة لمدة 5 ساعات و 50 دقيقة ثم تعيد الجلسة نفسها
        sleep 21000
